<html><head><title>fixture</title></head><body><script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["79935621212054214", "Senior Software Engineer, Embedded Systems, Platforms and Devices", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckfPoRGW6Pk1cKBG2tmWITZMhgusH_zdJ8sCBbWMxymotEjsA1Ny_i4lkoHkYcoL4tERXl9cZkZ2AXSvP0PbsUKVkN-KPUCjyujug4UXz1x7Ozf4BJvz42ifLYWOX3A%3D%3D_V2&loc=US&title=Senior+Software+Engineer", [null, "<ul>\n<li>Write and test product or system development code.\n</li>\n<li>Review code developed by other engineers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).\n</li>\n<li>Contribute to existing documentation or educational content and adapt content based on product/program updates and user feedback.\n</li>\n<li>Triage product or system issues and debug/track/resolve by analyzing the sources of issues and the impact on hardware, network, or service operations and quality. \n</li>\n<li>Participate in, or lead design reviews with peers and stakeholders to decide amongst available technologies.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree or equivalent practical experience.<br></li>\n<li>5 years of experience in low level systems programming languages (e.g., C++ or C).</li>\n<li>3 years of experience testing, maintaining, or launching software products, and 1 year of experience with software design and architecture.<br></li>\n<li>3 years of experience working with embedded operating systems.<br></li>\n<li>Experience with performance analysis, system profiling, and identifying software bottlenecks in systems.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Computer Science, or a related technical field.</li>\n<li>5 years of experience with data structures and algorithms.</li>\n<li>1 year of experience in a technical leadership role.\n</li>\n<li>Experience developing accessible technologies.\n</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["San Jose, CA, USA", ["San Jose, CA, USA"], "San Jose", null, "CA", "US"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>For decades, the computing revolution has reshaped our world driven by breakthroughs in compute, connectivity, mobile, and now, AI. Google's XR team is at the forefront of the next major leap – the convergence of AI and XR. This is more than just new devices – it's about reimagining how we interact with the world around us. We're building a future where lightweight XR devices pair with helpful AI to augment human intelligence, offering personalized, conversational, and contextually aware experiences.<br></p><p>The Platforms and Devices team encompasses Google's various computing software platforms across environments (desktop, mobile, applications), as well as our first party devices and services that combine the best of Google AI, software, and hardware. Teams across this area research, design, and develop new technologies to make our user's interaction with computing faster and more seamless, building innovative experiences for our users around the world.<br><b></b></p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $174000 - $252000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."], [2, 3, 4], [1786545466, 306000000], [1786545466, 306000000], [1786545466, 326000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor’s degree or equivalent practical experience.<br></li>\n<li>5 years of experience in low level systems programming languages (e.g., C++ or C).</li>\n<li>3 years of experience testing, maintaining, or launching software products, and 1 year of experience with software design and architecture.<br></li>\n<li>3 years of experience working with embedded operating systems.<br></li>\n<li>Experience with performance analysis, system profiling, and identifying software bottlenecks in systems.</li>\n</ul>"], 2], ["123087196289671878", "Software Engineer, AI/Machine Learning,  PhD, Early Career, 2027 Start", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckQolnz8S8lUyz_Plku-T9izTSZa4jaMAcf8J99la-TonEjoA1Ny_i-QHvbIO0J4JIL_JvoMBvOdJIiU3kU6EWi8pxURFKf_yN9iRjfRaDMnZ8dRCg0t5BPxPcK6O_V2&loc=US&title=Software+Engineer", [null, "<ul>\n<li>Collaborate or lead on team projects to carry out design, analysis, and development of advanced ML systems across the stack using your research expertise. </li>\n<li>Support building end-to-end ML Systems that involves working across the full stack, from low-level hardware acceleration and compiler optimizations to high-level model architecture and production APIs, transforming your research expertise into robust, scalable products.</li>\n<li>Optimize complex system performance by analyzing and fixing performance bottlenecks, memory inefficiencies, and errors in production systems to meet stringent customer goals.</li>\n<li>Elevate engineering excellence by writing well-tested code, conducting code reviews and fostering a culture of quality by advocating best engineering practices.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>PhD degree in Computer Science, Artificial Intelligence, Machine Learning, or related technical field, or equivalent practical experience.</li>\n<li>Experience coding in one of the following programming languages including but not limited to: Python, C, C++, Java, JavaScript or Golang.</li>\n<li><div><div>Experience in Machine Learning or Artificial Intelligence.</div></div></li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Research experience in designing, developing, or applying ML/AI systems or applications in a large-scale distributed environment.</li>\n<li>Experience in designing, training, or refining complex ML/AI models.</li>\n<li>Experience in building a stack for an AI-powered application, including data ingestion and processing pipelines, building APIs, and connecting the model to a user-facing interface.</li>\n<li>Familiarity with model architectures (CNNs, NLP Transformers, Diffusion/Vision Transformers).</li>\n<li>Experience developing with Rust and modern deep learning frameworks such as PyTorch, JAX, or TensorFlow.</li>\n<li>Availability to start in a full-time role in 2027.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Sunnyvale, CA, USA", ["Sunnyvale, CA, USA"], "Sunnyvale", null, "CA", "US"], ["Atlanta, GA, USA", ["Atlanta, GA, USA"], "Atlanta", null, "GA", "US"], ["Kirkland, WA, USA", ["Kirkland, WA, USA"], "Kirkland", null, "WA", "US"], ["Madison, WI, USA", ["Madison, WI, USA"], "Madison", null, "WI", "US"], ["Mountain View, CA, USA", ["Mountain View, CA, USA"], "Mountain View", null, "CA", "US"], ["New York, NY, USA", ["New York, NY, USA"], "New York", null, "NY", "US"], ["Raleigh, NC, USA", ["Raleigh, NC, USA"], "Raleigh", null, "NC", "US"], ["Durham, NC, USA", ["Durham, NC, USA"], "Durham", null, "NC", "US"], ["San Bruno, CA, USA", ["San Bruno, CA, USA"], "San Bruno", null, "CA", "US"], ["Seattle, WA, USA", ["Seattle, WA, USA"], "Seattle", null, "WA", "US"]], [null, "<p>Google's engineers develop next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at a massive scale. You'll be at the forefront of innovation, developing systems and AI and Machine Learning solutions. </p><p>As a PhD graduate, your research expertise is invaluable to us. Explore a variety of projects, collaborate with various teams, and contribute to products that are changing the world, across many product areas, including <a href=\"https://techsysinfra.google/\" target=\"_blank\">AI &amp; Infrastructure</a>, <a href=\"https://cloud.google.com/free?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=na-US-all-en-dr-bkws-all-all-trial-e-dr-1710134&amp;utm_content=text-ad-none-any-DEV_c-CRE_665735450627-ADGP_Hybrid+%7C+BKWS+-+EXA+%7C+Txt-Core-Google+Cloud-KWID_43700077223807304-aud-2232802565252:kwd-6458750523&amp;utm_term=KW_google%20cloud-ST_google+cloud&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=20363682672&amp;gclid=CjwKCAjw7_DEBhAeEiwAWKiCC0MaGBSqj7k9kdioFo_D_jETzMnJ42QeHHlT6kLuIqL7PCPuxLnhphoCDsYQAvD_BwE\" target=\"_blank\">Cloud</a>, <a href=\"https://about.youtube/\" target=\"_blank\">YouTube</a>, <a href=\"https://blog.google/products/search/google-search-ai-mode-update/#ai-mode-search\" target=\"_blank\">Search</a>, <a href=\"https://blog.google/products/ads-commerce/\" target=\"_blank\">Ads</a>  and more! </p><p>Our engineering teams include thousands of PhDs who bring their deep knowledge and research experience to enhance our systems and products. As a Google PhD Software Engineer, you will work on critical projects, with many opportunities to learn and  follow your interests. We expect our engineers to be creative and versatile, leading and identifying new problems to push the field and Google technology forward. </p><p>Google offers you exciting opportunities as it is one of the world’s leading producers and consumers of ML and AI technology, with decades of experience in designing, deploying, and using ML software and custom ML hardware infrastructure at massive scale.</p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.<div><br></div><div>US: $147000 - $210000 (USD) + 15% bonus target + equity + benefits</div><div><br></div><div>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>.  <p><b></b></p></div>"], [4], [1787557163, 702000000], [1787557163, 702000000], [1787557163, 737000000], [null, "In accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based employees. Benefits for this role include:<br><ul><li>Health, dental, vision, life, disability insurance</li><li>Retirement Benefits: 401(k) with company match</li><li>Paid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employment</li><li>Sick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance </li><li>Maternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeks</li><li>Baby Bonding Leave: 18 weeks</li><li>Holidays: 13 paid days per year</li></ul>"], null, null, [null, "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Sunnyvale, CA, USA; Atlanta, GA, USA; Kirkland, WA, USA; Madison, WI, USA; Mountain View, CA, USA; New York, NY, USA; Raleigh, NC, USA; Durham, NC, USA; San Bruno, CA, USA; Seattle, WA, USA</b>."], [null, "<ul>\n<li>PhD degree in Computer Science, Artificial Intelligence, Machine Learning, or related technical field, or equivalent practical experience.</li>\n<li>Experience coding in one of the following programming languages including but not limited to: Python, C, C++, Java, JavaScript or Golang.</li>\n<li><div><div>Experience in Machine Learning or Artificial Intelligence.</div></div></li>\n</ul>"], 2], ["80879399473160902", "Software Engineer, Site Reliability Engineering", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckY4WHQibiwkuk6HooDjmVDWJTo_hd9c9aIv7Irsll6uyEjsA1Ny_i-XNBqP1nvu9glKAv8SySr2pIuR7DI9l9r7ei98E04UiFancsoWXBUoAa6seUfDBgVoxmPTn8A%3D%3D_V2&loc=US&title=Software+Engineer", [null, "<ul>\n<li>Design, develop, test, and deploy scalable software solutions that maintain and enhance enterprise-grade products.</li>\n<li>Drive the technical vision and architectural roadmap for key projects, designing solutions for complex and ambiguous problems.</li>\n<li>Review code and technical designs from peers, providing feedback to ensure best practices in reliability, security, and efficiency.</li>\n<li>Triage and resolve complex system issues by analyzing root causes and implementing solutions to improve service operations and quality. Manage project priorities, deadlines, and deliverables to ensure successful execution of software development initiatives.</li>\n<li>Mentor other engineers and contribute to the engineering community through documentation, training, and participation in hiring processes.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree in Computer Science, Software Engineering, Information Technology, or a related field and 8 years of progressive, post-baccalaureate experience in the job offered or in a Software Engineer-related occupation.</li>\n<li>Alternatively, will accept a Master’s degree in Computer Science, Software Engineering, Information Technology, or a related field, and 5 years of experience in the  job offered or in a Software Engineer-related occupation. </li>\n<li>Position requires 5 years of experience in the following: Advanced software development or programming, including code refactoring, debugging, and application of data structures/algorithms; Software and systems architecture design or solution architecture for performance, reliability, and cost; Data analysis and synthesis or systems analysis for system simplification and process automation; Responding to large service outages to restore service; and Technical leadership to generate multi-year roadmaps and milestones for the entire team.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Sunnyvale, CA, USA", ["Sunnyvale, CA, USA"], "Sunnyvale", null, "CA", "US"]], [null, "<p>Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.</p><p>The US base salary range for this full-time position is $255,700 - $300,000  + 20%bonus target + equity + benefits determined by role, level, and location. Individual pay is determined by additional factors, including job-related skills, experience, and relevant education or training.   Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>.</p><br><p><b></b></p>"], [3, 2], [1788192527, 873000000], [1788192527, 873000000], [1788192527, 892000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor’s degree in Computer Science, Software Engineering, Information Technology, or a related field and 8 years of progressive, post-baccalaureate experience in the job offered or in a Software Engineer-related occupation.</li>\n<li>Alternatively, will accept a Master’s degree in Computer Science, Software Engineering, Information Technology, or a related field, and 5 years of experience in the  job offered or in a Software Engineer-related occupation. </li>\n<li>Position requires 5 years of experience in the following: Advanced software development or programming, including code refactoring, debugging, and application of data structures/algorithms; Software and systems architecture design or solution architecture for performance, reliability, and cost; Data analysis and synthesis or systems analysis for system simplification and process automation; Responding to large service outages to restore service; and Technical leadership to generate multi-year roadmaps and milestones for the entire team.</li>\n</ul>"], 3]], null, 455, 20], sideChannel: {}});</script></body></html>
