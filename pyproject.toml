[project]
name = "jobradar"
version = "0.1.0"
description = "AI-native job discovery with transparent ranking and agent fit reviews"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "cryptography>=42",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: needs Playwright Chromium (skipped when it cannot launch)",
  "node: needs node and the vendor/career-ops checkout (skipped otherwise)",
]
